# Supabase Managed PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST:db.xxxxxxxx.supabase.co}:5432/postgres?sslmode=require
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:your-supabase-db-password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Settings for Supabase PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Schema Migrations on Supabase
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
